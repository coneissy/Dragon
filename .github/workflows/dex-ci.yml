name: Dragon DEX CI
on:
  push:
    paths: ['dex/**','.github/workflows/dex-ci.yml']
  pull_request:
    paths: ['dex/**','.github/workflows/dex-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
