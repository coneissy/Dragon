name: Fix dashboard root route

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix dashboard root route implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dashboard root route
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/dragon/main.py')
          s = p.read_text()
          required = [
              'self.path == "/"',
              'Location", "/dashboard"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'dashboard root route missing: {missing}')
          print('Dashboard root route verified.')
          PY
