name: Dragon single-engine smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "src"
  DRY_RUN: "true"
  LIVE_TRADING: "false"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate YAML configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.').rglob('*.yaml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY

      - name: Enforce CI safety mode
        run: |
          test "$DRY_RUN" = "true"
          test "$LIVE_TRADING" = "false"
          ! grep -RInE '^[[:space:]]*(export[[:space:]]+)?(LIVE_TRADING|DRY_RUN)[[:space:]]*=[[:space:]]*(true|false)[[:space:]]*$' --exclude-dir=.git --exclude='*.md' --exclude='.env.example' .

      - name: Run test suite
        run: python -m pytest -q
