name: Dragon MAX UNIVERSE smoke

on:
  push:
    branches: [max-universe-excel-v5]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_startup_smoke.py tests/test_excel_profile.py tests/test_max_universe_risk.py
