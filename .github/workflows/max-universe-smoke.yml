name: Dragon single-engine smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_calculator.py tests/test_main.py tests/test_full_universe_runner_v3.py tests/test_triangles.py tests/test_risk.py
