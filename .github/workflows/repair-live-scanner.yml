name: repair-live-scanner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair silent websocket fallback and scanner telemetry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('full_universe_runner.py')
          s = p.read_text()
          marker = '# DRAGON_LIVE_SCANNER_RECOVERY_V2'
          if marker in s:
              raise SystemExit(0)
          old = '''                        if data.get("s") and data.get("b") is not None and data.get("a") is not None:\n                            if queue.full():'''
          new = '''                        if data.get("s") and data.get("b") is not None and data.get("a") is not None:\n                            with web_runner.LOCK:\n                                web_runner.STATE["last_depth_update"] = time.time()\n                                web_runner.STATE["market_data_updates"] = web_runner.STATE.get("market_data_updates", 0) + 1\n                            if queue.full():'''
          if old not in s:
              raise SystemExit('websocket parser anchor not found')
          s = s.replace(old, new, 1)
          old = '''                shard_status = dict(web_runner.STATE.get("ws_shard_status", {}))\n                ws_up = any(value == "connected" for value in shard_status.values())\n            if ws_up:\n                await asyncio.sleep(REST_FALLBACK_SECONDS)\n                continue'''
          new = '''                shard_status = dict(web_runner.STATE.get("ws_shard_status", {}))\n                ws_up = any(value == "connected" for value in shard_status.values())\n                last_depth = float(web_runner.STATE.get("last_depth_update", 0) or 0)\n                depth_silent = last_depth <= 0 or (time.time() - last_depth) > 8.0\n            if ws_up and not depth_silent:\n                await asyncio.sleep(REST_FALLBACK_SECONDS)\n                continue'''
          if old not in s:
              raise SystemExit('fallback anchor not found')
          s = s.replace(old, new, 1)
          old = '''                books[symbol] = {"bids": bids, "asks": asks, "depth_ts": time.monotonic() * 1000}'''
          new = '''                books[symbol] = {"bids": bids, "asks": asks, "depth_ts": time.monotonic() * 1000, "source": item.get("_source", "binance_ws_depth") }'''
          if old not in s:
              raise SystemExit('book storage anchor not found')
          s = s.replace(old, new, 1)
          old = '''        web_runner.event("REST_FALLBACK", f"WS unavailable; BookTicker refreshed {count} symbols", symbols=count)'''
          new = '''        web_runner.event("REST_FALLBACK", f"Market-data recovery; BookTicker refreshed {count} symbols", symbols=count, depth_silent=depth_silent)'''
          if old not in s:
              raise SystemExit('fallback event anchor not found')
          s = s.replace(old, new, 1)
          s = marker + "\n" + s
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add full_universe_runner.py
          git diff --cached --quiet && exit 0
          git commit -m 'Repair silent market data recovery path'
          git push