services:
  - type: web
    name: dragon-arbitrage-live
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dragon.engine
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PORT
        value: 10000
      - key: BINANCE_API_BASE
        value: https://api.binance.com
      - key: BINANCE_WS_BASE
        value: wss://stream.binance.com:9443/ws
      # Safe default: the new single engine must pass runtime checks before live orders.
      - key: DRY_RUN
        value: "true"
      - key: LIVE_TRADING
        value: "false"
      - key: MIN_NET_EDGE_BPS
        value: "3"
      - key: MIN_EXPECTED_PROFIT_USDT
        value: "0"
      - key: MIN_TRADE_NOTIONAL_USDT
        value: "0.5"
      - key: MAX_NOTIONAL_USDT
        value: "0"
      - key: MAX_SLIPPAGE_BPS
        value: "3"
      - key: FEE_BPS
        value: "10"
      - key: ARB_CAPITAL_ALLOCATION_PCT
        value: "0.95"
      - key: ARB_SAFETY_RESERVE_USDT
        value: "1"
      - key: LIVE_ORDER_COOLDOWN_MS
        value: "0"
      - key: MAX_TRIANGLES
        value: "0"
      - key: MAX_WS_SYMBOLS
        value: "300"
      - key: STALE_MS
        value: "500"
      - key: MAX_CONSECUTIVE_LOSSES
        value: "5"
      - key: MAX_DRAWDOWN_PCT
        value: "15"
      - key: ORDER_TIMEOUT_MS
        value: "5000"
      - key: DEPTH_LEVELS
        value: "20"
      - key: HEALTH_FAIL_OPEN
        value: "false"
      - key: LEDGER_PATH
        value: /tmp/dragon_ledger.sqlite3
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: DASHBOARD_CONTROL_TOKEN
        generateValue: true
